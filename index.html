<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba de escáner</title>

  <!-- Lector de códigos -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #resultado {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #e8f5e9;
      border: 1px solid #b7dfb9;
      display: none;
    }

    #codigo {
      font-size: 24px;
      font-weight: bold;
      word-break: break-all;
    }

    .estado {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #eef2ff;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #iniciar {
      background: #2563eb;
      color: white;
    }

    #detener {
      background: #ef4444;
      color: white;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>📷 Escáner de productos</h1>
</header>

<div class="container">

  <div class="card">

    <h2>Escanear código de barras</h2>

    <p>
      Presioná iniciar y apuntá la cámara al código de barras del producto.
    </p>

    <button id="iniciar" onclick="iniciarScanner()">
      📷 Iniciar cámara
    </button>

    <button id="detener" onclick="detenerScanner()">
      ✕ Detener cámara
    </button>

    <div id="estado" class="estado">
      Cámara detenida.
    </div>

    <div id="reader"></div>

    <div id="resultado">
      <div>Código detectado:</div>
      <div id="codigo"></div>
    </div>

  </div>

</div>

<script>

  let scanner = null;
  let escaneando = false;

  function iniciarScanner() {

    document.getElementById("estado").textContent =
      "Solicitando acceso a la cámara...";

    document.getElementById("iniciar").style.display = "none";
    document.getElementById("detener").style.display = "block";

    scanner = new Html5Qrcode("reader");

    const configuracion = {
      fps: 10,
      qrbox: {
        width: 300,
        height: 150
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39
      ]
    };

    scanner.start(
      {
        facingMode: "environment"
      },
      configuracion,

      function(codigoDetectado) {

        document.getElementById("codigo").textContent =
          codigoDetectado;

        document.getElementById("resultado").style.display =
          "block";

        document.getElementById("estado").textContent =
          "✅ Código detectado correctamente.";

        console.log("Código detectado:", codigoDetectado);

      },

      function(error) {
        // No mostramos errores durante el escaneo.
      }

    ).then(function() {

      escaneando = true;

      document.getElementById("estado").textContent =
        "🟢 Cámara activa. Apuntá al código de barras.";

    }).catch(function(error) {

      console.error(error);

      document.getElementById("estado").textContent =
        "❌ No se pudo iniciar la cámara.";

      document.getElementById("iniciar").style.display =
        "block";

      document.getElementById("detener").style.display =
        "none";
    });
  }


  function detenerScanner() {

    if (scanner && escaneando) {

      scanner.stop()
        .then(function() {

          scanner.clear();

          scanner = null;
          escaneando = false;

          document.getElementById("estado").textContent =
            "Cámara detenida.";

          document.getElementById("iniciar").style.display =
            "block";

          document.getElementById("detener").style.display =
            "none";

        })
        .catch(function(error) {

          console.error(error);

        });

    } else {

      document.getElementById("iniciar").style.display =
        "block";

      document.getElementById("detener").style.display =
        "none";
    }
  }

</script>

</body>
</html>
